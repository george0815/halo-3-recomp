# XenonRecomp configuration for waves/L360.dll, a DLL that Halo 3 loads at runtime
# with XexLoadImage. Same options as halo3.toml; see the comments there.

[main]
file_path = "../../../private/game/waves/L360.dll"
out_directory_path = "../../modules/L360"
switch_table_file_path = "L360_switch_tables.toml"

# Keeps _xstart and the save/restore helpers from clashing with the other
# modules' when everything links into one program.
symbol_prefix = "L360_"

skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

# From `h3xexinfo private/game/waves/L360.dll`. Helpers the DLL doesn't contain are
# left out.
restgprlr_14_address = 0x89422180
savegprlr_14_address = 0x89422130
restfpr_14_address = 0x8942459C
savefpr_14_address = 0x89424550

# Functions with an exception handler are preceded by two words: the handler
# (__C_specific_handler or __CxxFrameHandler) and its data. Skip them so the
# function sweep doesn't decode them as code.
invalid_instructions = [
    { data = 0x00000000, size = 4 }, # Padding
    { data = 0x89422498, size = 8 },
    { data = 0x8943F61C, size = 8 },
]

# Leaf functions with jump tables and no .pdata entry, sized by
# tools/h3analysis.py functions (see halo3.toml).
functions = [
    { address = 0x89415808, size = 0x2A8 },
]
