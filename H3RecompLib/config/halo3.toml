# XenonRecomp configuration for Halo 3 (Xbox 360).
# Paths are relative to this file. Option reference:
# thirdparty/XenonRecomp/README.md ("XenonRecomp" section).

[main]
file_path = "../../private/default.xex"

# Uncomment once you have a title update (.xexp). XenonRecomp writes the
# patched XEX on first run and reuses it after that.
# patch_file_path = "../../private/default.xexp"
# patched_file_path = "../../private/default_patched.xex"

out_directory_path = "../ppc"

# Produced by XenonAnalyse (tools/recompile.sh runs it if missing).
switch_table_file_path = "halo3_switch_tables.toml"

# Optimizations: leave OFF until the game boots. They make debugging much
# harder because registers stop living in PPCContext.
skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

# Register save/restore helpers. Run `h3xexinfo private/default.xex` and
# paste the lines it prints here. 0 means "not found yet"; XenonRecomp will
# complain until all eight are filled in.
restgprlr_14_address = 0x8258E000
savegprlr_14_address = 0x8258DFB0
restfpr_14_address = 0x82593D5C
savefpr_14_address = 0x82593D10
restvmx_14_address = 0x826F4A38
savevmx_14_address = 0x826F47A0
restvmx_64_address = 0x826F4ACC
savevmx_64_address = 0x826F4834

# The CRT's longjmp (restores r1/r13-r31/f14-f31/v regs and lr from the
# buffer, RtlUnwind for SEH frames) and setjmp (saves them). Only library
# code around 0x825B4000-0x825CF000 calls them (error exits). Recompiled as
# ordinary functions, longjmp would return to its caller instead of to
# setjmp's; XenonRecomp turns these calls into host setjmp/longjmp.
longjmp_address = 0x826F36B0
setjmp_address = 0x826F3AF0

# Manual function boundaries for anything XenonAnalyse gets wrong
# (typically functions containing jump tables).
#
# Leaf functions with jump tables and no .pdata entry. XenonRecomp's analyser
# stops these at the bctr. Generated by:
#   tools/h3analysis.py functions private/image.bin \
#       H3RecompLib/config/halo3_switch_tables.toml \
#       H3RecompLib/ppc/ppc_func_mapping.cpp <recompile log>
functions = [
    # .pdata says 0x298, one instruction short: a jump table case at 0x822010D0
    # is a single `b` back into the loop. That instruction is also a function
    # of its own (a thunk a function pointer table calls); the runtime
    # registers it by hand (H3Recomp/kernel/modules.cpp).
